apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        startupProbe:
          httpGet:
            path: /     ##to check the startup of the pod, we can use the startup probe. The startup probe checks if the application has started successfully. If the startup probe fails, the pod will be restarted until it starts successfully.
            port: 80
          periodSeconds: 5
          failureThreshold: 6
