apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "hellworld.fullname" . }}-test-connection"
  labels:
    {{- include "hellworld.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "hellworld.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never